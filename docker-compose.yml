
services:
  windows:
    image: dockurr/windows:latest
    container_name: tiny11

    environment:
      VERSION: "https://archive.org/download/tiny-11-NTDEV/tiny11%20b2%28no%20sysreq%29.iso"
      CPU_CORES: "3"
      RAM_SIZE: "10G"
      DISK_SIZE: "24G"
      USERNAME: "user"
      PASSWORD: "password"
      ATTENDED: "Y"

    devices:
      - /dev/kvm
      - /dev/net/tun

    cap_add:
      - NET_ADMIN

    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"

    volumes:
      - ./storage:/storage

    stop_grace_period: 2m
    restart: unless-stopped
